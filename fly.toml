# Companion compute on Fly (H01). Postgres is Alchemy unmanaged (Docker A/B or
# Fly.Machine+volume option C) — not Fly Managed Postgres / alchemy Fly.Postgres
# MPG. See docs/ops/hosted-fly.md and scripts/fly-alchemy-pg.sh.
#
# Replace `app` after `fly apps create <name> --org personal` (or keep this name).
# Do not point app.zoen.space product DNS at this app.

app = "companion-tironi"
primary_region = "gru"

[build]
dockerfile = "Dockerfile"

[env]
EVE_NEXT_PRODUCTION_PORT = "4274"
NODE_ENV = "production"
# Public base + auth URLs and DATABASE_* must be Fly secrets / [env] set by
# the operator (names only in docs). Never commit secret values here.

[http_service]
internal_port = 3000
force_https = true
auto_stop_machines = "off"
auto_start_machines = true
min_machines_running = 1
processes = ["app"]


[[vm]]
size = "shared-cpu-2x"
memory = "2048mb"
cpus = 2

[checks]
[checks.alive]
type = "http"
method = "get"
path = "/eve/v1/health"
port = 3000
interval = "15s"
timeout = "5s"
grace_period = "60s"

# External uptime probe for Companion prod.
# Manual curl checklists are NOT enough alone — this schedule fails the job
# (GitHub Actions failure notification) and optionally posts to a webhook/ntfy
# when repo secrets are configured. Never print secret values.
name: Companion uptime

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: companion-uptime
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  probe:
    name: Probe zoen.tironi.xyz
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Run uptime probe
        env:
          # Optional push sinks (names only in docs). Leave unset to rely on
          # GitHub workflow-failure notifications for the workflow author.
          COMPANION_UPTIME_ALERT_URL: ${{ secrets.COMPANION_UPTIME_ALERT_URL }}
          COMPANION_UPTIME_NTFY_TOPIC: ${{ secrets.COMPANION_UPTIME_NTFY_TOPIC }}
          COMPANION_UPTIME_BASE_URL: https://zoen.tironi.xyz
        run: bash scripts/companion-uptime-probe.sh --quiet

  postgres:
    name: Verify PostgreSQL backup, disk and private memory
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - run: pnpm --dir infrastructure install --frozen-lockfile
      - name: Verify actual backup repository
        working-directory: infrastructure
        env:
          FLY_API_TOKEN: ${{ secrets.ZOEN_FLY_OPERATIONS_TOKEN }}
        run: node operations.ts check

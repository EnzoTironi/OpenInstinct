name: Checks

on:
  pull_request:
  push:
    branches:
      - main
      - master

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install isolated infrastructure dependencies
        run: pnpm --dir infrastructure install --frozen-lockfile

      - name: Run checks
        # Each compiler/linter/test process also uses its own CPU pool.
        run: pnpm check --concurrency=1

      - name: Check isolated infrastructure
        run: |
          pnpm --dir infrastructure peers check
          pnpm --dir infrastructure types:check

  runtime-storage:
    name: Runtime storage and build
    permissions:
      contents: read
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: companion_runtime_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/companion_runtime_test
      DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@127.0.0.1:5432/companion_runtime_test
      BETTER_AUTH_URL: http://127.0.0.1:3000
      OPERON_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/companion_runtime_test
      OPERON_BUILDER_ENABLED: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build pinned Operon runtime
        run: |
          sh scripts/prepare-operon.sh "$RUNNER_TEMP/operon"
          echo "OPERON_HOME=$RUNNER_TEMP/operon" >> "$GITHUB_ENV"
      - name: Generate ephemeral installation keys
        run: |
          node --input-type=module <<'JS'
          import { randomBytes, randomUUID } from 'node:crypto';
          import { appendFileSync } from 'node:fs';
          appendFileSync(
            process.env.GITHUB_ENV,
            [
              `BETTER_AUTH_SECRET=${randomBytes(32).toString('hex')}`,
              `SECRET_ENCRYPTION_KEY=${randomBytes(32).toString('base64')}`,
              // Runtime proofs that exercise channel identity need a stable
              // installation id for the job; product Telegram credentials are unused.
              `TELEGRAM_BOT_ID=ci-runtime-${randomUUID()}`,
              `TELEGRAM_BOT_USERNAME=ci_runtime_bot`,
              '',
            ].join('\n'),
          );
          JS
      - name: Install ffprobe for native audio preflight
        run: |
          # Isolate apt from broken third-party indexes on GitHub runners
          # (google-chrome Packages.gz hash-sum mismatch).
          sudo apt-get update \
            -o Dir::Etc::sourcelist="sources.list" \
            -o Dir::Etc::sourceparts="-" \
            -o APT::Get::List-Cleanup="0"
          sudo apt-get install -y ffmpeg
      - name: Migrate application and workflow databases
        run: |
          pnpm db:migrate
          pnpm workflow:migrate
          pnpm workflow:migrate
      - name: Verify real Postgres storage
        run: pnpm test:runtime
      - name: Verify MCP protocol and workspace isolation
        run: pnpm exec vitest run server/operon/mcp-client.test.ts
      - name: Build web app and agent
        run: pnpm build --force

name: Checks

on:
  pull_request:
  push:
    branches:
      - main
      - master

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install isolated infrastructure dependencies
        run: pnpm --dir infrastructure install --frozen-lockfile

      - name: Run checks
        # Each compiler/linter/test process also uses its own CPU pool.
        run: pnpm check --concurrency=1

      - name: Check isolated infrastructure
        run: |
          pnpm --dir infrastructure peers check
          pnpm --dir infrastructure types:check

  runtime-storage:
    name: Runtime storage and build
    permissions:
      contents: read
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: companion_runtime_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/companion_runtime_test
      DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@127.0.0.1:5432/companion_runtime_test
      BETTER_AUTH_URL: http://127.0.0.1:3000
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate ephemeral installation keys
        run: |
          node --input-type=module <<'JS'
          import { randomBytes, randomUUID } from 'node:crypto';
          import { appendFileSync } from 'node:fs';
          appendFileSync(
            process.env.GITHUB_ENV,
            [
              `BETTER_AUTH_SECRET=${randomBytes(32).toString('hex')}`,
              `SECRET_ENCRYPTION_KEY=${randomBytes(32).toString('base64')}`,
              // Runtime proofs that exercise channel identity need a stable
              // installation id for the job; product Telegram credentials are unused.
              `TELEGRAM_BOT_ID=ci-runtime-${randomUUID()}`,
              `TELEGRAM_BOT_USERNAME=ci_runtime_bot`,
              '',
            ].join('\n'),
          );
          JS
      - name: Install ffprobe for native audio preflight
        run: |
          # Isolate apt from broken third-party indexes on GitHub runners
          # (google-chrome Packages.gz hash-sum mismatch).
          sudo apt-get update \
            -o Dir::Etc::sourcelist="sources.list" \
            -o Dir::Etc::sourceparts="-" \
            -o APT::Get::List-Cleanup="0"
          sudo apt-get install -y ffmpeg
      - name: Migrate application and workflow databases
        run: |
          pnpm db:migrate
          pnpm workflow:migrate
          pnpm workflow:migrate
      - name: Verify real Postgres storage
        run: pnpm test:runtime
      - name: Build web app and agent
        run: pnpm build --force

  memory:
    name: Private Mem0 service
    permissions:
      contents: read
    runs-on: ubuntu-latest
    env:
      ZOEN_MEMORY_DATABASE_URL: postgresql://zoen_memory:ci-memory-password@127.0.0.1:5432/zoen_memory
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install pinned package manager
        run: python -m pip install uv==0.12.13
      - name: Build the production PostgreSQL image and prove recovery
        run: |
          docker build -t zoen-postgres-proof:pg17-backup infrastructure/postgres
          bash infrastructure/postgres/test-recovery.sh
      - name: Start pgvector for memory integration tests
        run: |
          docker run -d --name memory-postgres -p 127.0.0.1:5432:5432 \
            -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres \
            -e ZOEN_MEMORY_DATABASE_PASSWORD=ci-memory-password \
            -e POSTGRES_DB=companion_runtime_test zoen-postgres-proof:pg17-backup
          for attempt in {1..60}; do
            docker exec memory-postgres pg_isready -U postgres && break
            sleep 1
          done
          docker exec memory-postgres /usr/local/bin/bootstrap-memory.sh
      - name: Verify the real memory adapter with isolated model fixtures
        working-directory: infrastructure/memory
        run: |
          uv sync --frozen
          uv run pytest
